name: Link check

# External links are checked on a schedule rather than per-PR: they break for
# reasons unrelated to the change under review, and a flaky merge gate teaches
# contributors to ignore red. A failure here opens an issue instead.
#
# This checks the Markdown sources rather than the built site, matching the
# per-PR check in ci.yml. Building the site is unnecessary here: every external
# link a reader can follow is written in a source file, and the built site adds
# root-relative asset links that only resolve once served. It also means this
# job needs neither the Rust toolchain nor a built extension module.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: check all links, including external
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --exclude-all-private --no-progress
            './docs/**/*.md' './*.md'
          fail: false
          output: ./lychee/out.md

      # Only when the repository has issues enabled. A template is cloned into
      # repositories that may have them turned off, and create-issue-from-file
      # hard-fails there.
      - name: open an issue on failure
        if: steps.lychee.outputs.exit_code != 0 && github.event.repository.has_issues
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found in the documentation
          content-filepath: ./lychee/out.md
          labels: documentation

      # Without issues there is nowhere to file the report, so fail the run
      # instead -- otherwise broken links pass silently.
      - name: fail if links are broken and issues are disabled
        if: steps.lychee.outputs.exit_code != 0 && !github.event.repository.has_issues
        run: |
          echo "::error::lychee found broken links; issues are disabled on this repository."
          cat ./lychee/out.md >> "$GITHUB_STEP_SUMMARY"
          exit 1
