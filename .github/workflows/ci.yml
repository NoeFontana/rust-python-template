name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9]*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-rust:
    name: lint-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test-rust:
    name: test-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest
        run: cargo nextest run --workspace --exclude rust-python-template-ffi
      - name: cargo test --doc
        run: cargo test --doc --workspace --exclude rust-python-template-ffi

  docs-rust:
    name: docs-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings --cfg docsrs"
        run: cargo doc --workspace --exclude rust-python-template-ffi --no-deps --all-features

  build-wheel:
    name: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
      - name: maturin build
        run: uv run --with maturin maturin build --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  lint-py:
    name: lint-py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
      - name: uv sync (dev deps only, skip building the project)
        run: uv sync --locked --group test --no-install-project
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright

  test-py:
    name: test-py
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist
      - name: install wheel into a fresh venv
        run: |
          uv venv --python "${{ matrix.python-version }}"
          uv pip install dist/*.whl pytest
      - name: pytest
        run: uv run pytest tests/python -m "not slow"

  spelling:
    name: spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Run in CI rather than only in pre-commit, so it also gates PRs from
      # forks, which do not run the contributor's local hooks. Same recipe,
      # same config.
      - name: codespell
        run: just spell

  build-docs:
    name: build-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # git-revision-date-localized needs history to date the pages.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: uv sync
        run: uv sync --locked --all-groups

      # mkdocstrings imports the Python wrapper to render the API reference,
      # and the wrapper re-exports from the compiled `._core`. Both the docs
      # build and the docs tests therefore need a built extension module.
      - name: build the extension module
        run: uv run maturin develop

      # The generated reference pages are committed. Regenerate them and fail
      # if the result differs from what the PR carries.
      - name: check generated pages are current
        run: |
          just docs-index
          git diff --exit-code -- docs/reference/

      - name: docs examples
        run: just docs-test

      # This is the internal-link gate: validation.links.unrecognized_links is
      # set to warn, and --strict turns warnings into errors, so a broken link
      # on any published page fails here.
      #
      # There is deliberately no link checker on this path. It would only add
      # coverage of docs/adr/, docs/engineering/ and the root Markdown files,
      # which mkdocs does not build -- low-severity links, not worth a
      # third-party action on the job that gates every merge. link-check.yml
      # covers those, plus external URLs, on a weekly schedule.
      - name: mkdocs build --strict
        run: just docs-build

  # `mike` publishes by committing the built site to the gh-pages branch, so
  # this job needs `contents: write` and full history. It builds the site
  # itself, which means it also needs the extension module built first.
  deploy-docs:
    name: deploy-docs
    needs: build-docs
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7

      - name: uv sync
        run: uv sync --locked --all-groups

      - name: build the extension module
        run: uv run maturin develop

      - name: configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # main publishes the `latest` alias.
      - name: deploy latest
        if: github.ref == 'refs/heads/main'
        run: uv run mike deploy --push --update-aliases main latest

      # A release tag publishes <major>.<minor> plus the `stable` alias, so
      # patch releases overwrite within their minor (ADR-0003 §"Versioning").
      - name: deploy release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME}"
          minor="${version%.*}"
          uv run mike deploy --push --update-aliases "$minor" stable
          uv run mike set-default --push stable
